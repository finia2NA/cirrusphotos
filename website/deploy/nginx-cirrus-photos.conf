# Reference server block for the Cirrus Photos site.
# `certbot --nginx` adds the TLS listener and the
# http to https redirect to this file; this is the state before certbot.

server {
    listen 80;
    listen [::]:80;
    server_name cirrusphotos.richardhanss.de;

    root /var/www/cirrus-photos;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Static assets: cache for a week.
    location ~* \.(png|jpg|jpeg|svg|ico|css)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Sparkle appcast: always revalidate.
    location = /appcast.xml {
        default_type application/xml;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
