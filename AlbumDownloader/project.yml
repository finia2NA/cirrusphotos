name: AlbumDownloader
options:
  bundleIdPrefix: io.github.finia2na
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
targets:
  album-downloader:
    type: tool
    platform: macOS
    sources:
      - path: Sources
      - path: Support
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: album-downloader
        PRODUCT_BUNDLE_IDENTIFIER: io.github.finia2na.albumdownloader
        MARKETING_VERSION: "1.0"
        INFOPLIST_FILE: Support/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEAD_CODE_STRIPPING: YES
      configs:
        Release:
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "arm64 x86_64"
  AlbumDownloaderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources
        excludes: ["main.swift"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
schemes:
  album-downloader:
    build:
      targets:
        album-downloader: all
        AlbumDownloaderTests: [test]
    test:
      targets: [AlbumDownloaderTests]
